  <circle cx="24" cy="7"   r="3.5"  fill="#1d3461"/>
  <circle cx="38" cy="7"   r="3.5"  fill="#1d3461"/>
  <rect x="4"     y="12"   width="40"  height="2"   rx="1"    fill="#1d3461"/>
  <rect x="8.25"  y="15"   width="3.5" height="20"  rx="1.75" fill="#1d3461"/>
  <rect x="22.25" y="15"   width="3.5" height="20"  rx="1.75" fill="#1d3461"/>
  <rect x="36.25" y="15"   width="3.5" height="20"  rx="1.75" fill="#1d3461"/>
