<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Stojíme za univerzitami">
  <title>Stojíme za univerzitami</title>

  <!-- Heads -->
  <circle cx="10" cy="7"  r="3.5" fill="#1d3461"/>
  <circle cx="24" cy="7"  r="3.5" fill="#1d3461"/>
  <circle cx="38" cy="7"  r="3.5" fill="#1d3461"/>

  <!-- Entablature – connects figures as columns, symbolises solidarity -->
  <rect x="4"    y="12"  width="40"   height="2"   rx="1"    fill="#1d3461"/>

  <!-- Column shafts / bodies -->
  <rect x="8.25" y="15"  width="3.5"  height="20"  rx="1.75" fill="#1d3461"/>
  <rect x="22.25" y="15" width="3.5"  height="20"  rx="1.75" fill="#1d3461"/>
  <rect x="36.25" y="15" width="3.5"  height="20"  rx="1.75" fill="#1d3461"/>

  <!-- Stylobate / ground -->
  <rect x="4"    y="37"  width="40"   height="2.5" rx="1.25" fill="#1d3461"/>
</svg>
