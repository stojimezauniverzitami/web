# ── OPEN LETTER (otevreny-dopis.html) ────────────────────────────────────────

letter:

  meta_description:
    cs: "Otevřený dopis iniciativy Stojíme s univerzitami adresovaný vedení Univerzity Karlovy na obranu akademické svobody."
    en: "An open letter from the Standing with Universities initiative addressed to the leadership of Charles University in defence of academic freedom."

  meta_title:
    cs: "Otevřený dopis – Stojíme s univerzitami"
    en: "Open Letter – Standing with Universities"

  header_label:
    cs: "Otevřený dopis"
    en: "Open Letter"

  salutation:
    cs: "Vážené vedení Univerzity Karlovy,"
    en: "Dear leadership of Charles University,"

  p1:
    cs: "obracíme se na Vás jakožto studující, absolventstvo, pedagogické a akademické pracovnictvo českých a slovenských univerzit, kterým záleží na demokratické tradici univerzitního vzdělávání a akademických svobod."
    en: "we are addressing you as students, graduates, pedagogical and academic staff of Czech and Slovak universities who care about the democratic tradition of university education and academic freedom."

  # ⚠ HTML — keep <a href="...">…</a> links; translate only the link text and surrounding text
  p2_html:
    cs: "Tímto otevřeným dopisem reagujeme na útoky na nezávislost univerzitního prostředí a znevažování společenského významu humanitních věd, ke kterému dochází ze stran současné politické reprezentace, jmenovitě ministra zahraničních věcí Petra Macinky, a také některých médií. Vyjadřujeme solidaritu se studujícími, pedagogickým i akademickým pracovnictvem, které je terčem těchto útoků a neprávem je v médiích <a href=\"https://medium.seznam.cz/clanek/matane-akademicka-svoboda-nebo-inkubator-extremismu-proc-se-ceske-univerzity-meni-v-bojiste-267324\">spojováno s extremismem</a>, a vyzýváme vedení Univerzity Karlovy k tomu, aby se postavilo za nezávislost akademické obce."
    en: "With this open letter, we respond to attacks on the independence of the university environment and the belittling of the social importance of the humanities, carried out by representatives of the current political leadership — namely Foreign Minister Petr Macinka — and by certain media outlets. We express solidarity with students, pedagogical, and academic staff who are targeted by these attacks and are unjustly <a href=\"https://medium.seznam.cz/clanek/matane-akademicka-svoboda-nebo-inkubator-extremismu-proc-se-ceske-univerzity-meni-v-bojiste-267324\">associated with extremism</a> in the media, and we call on the leadership of Charles University to stand up for the independence of the academic community."

  # ⚠ HTML — keep <a href="...">…</a> links
  p3_html:
    cs: "V posledních týdnech v mediálním prostoru dochází k nesmyslnému očerňování vysokoškolských institucí, zejména Fakulty humanitních studií, skrze zkratkovitá nebo vyloženě nepravdivá vyjádření obviňující ji z toho, že <a href=\"https://www.youtube.com/watch?v=otlqEtlbcdc&list=PL8G0256zv5Cuhnk4MU3eQOSccjhKIsMEr&index=4\">„vychovává teroristy“</a> . Tento a podobné útoky jsou součástí snahy o účelné ovlivňování a omezování akademické diskuze, k níž dochází zejména ve spojitosti s urgentními tématy klimatické krize, genderové a ekonomické nerovnosti či lidských práv. Podobná rétorika představuje nebezpečný precedens. V USA již umožnila <a href=\"https://www.nytimes.com/2026/03/07/arts/humanities-endowment-doge-trump.html\">rozsáhlé škrty ve financování historického a sociálněvědního výzkumu</a> týkajícího se historicky znevýhodňovaných skupin, klimatické změny či Holocaustu, v Maďarsku vedla ke zrušení programu Gender Studies a následnému <a href=\"https://www.theguardian.com/world/2018/dec/03/dark-day-freedom-george-soros-affiliated-central-european-university-quits-hungary\">odchodu celé Central European University</a> ze země."
    en: "In recent weeks, the media space has seen senseless smearing of higher education institutions, especially the Faculty of Humanities, through reductive or outright false statements accusing it of <a href=\"https://www.youtube.com/watch?v=otlqEtlbcdc&list=PL8G0256zv5Cuhnk4MU3eQOSccjhKIsMEr&index=4\">“training terrorists”</a>. These and similar attacks are part of an effort to deliberately influence and curtail academic discourse, particularly in connection with urgent topics such as the climate crisis, gender and economic inequality, and human rights. Such rhetoric sets a dangerous precedent. In the United States, it has already enabled <a href=\"https://www.nytimes.com/2026/03/07/arts/humanities-endowment-doge-trump.html\">sweeping cuts to funding for historical and social science research</a> concerning historically marginalised groups, climate change, and the Holocaust; in Hungary it led to the abolition of the Gender Studies programme and the subsequent <a href=\"https://www.theguardian.com/world/2018/dec/03/dark-day-freedom-george-soros-affiliated-central-european-university-quits-hungary\">departure of the entire Central European University</a> from the country."

  p4:
    cs: "Humanitní a společenskovědní obory jsou základem pro demokratickou a pluralitní společnost postavenou na lidských právech a lidské důstojnosti. Není náhodou, že autoritářské režimy napříč historií volí právě je jako jedny ze svých prvních cílů. Představitelé strany Motoristé sobě si na dehonestaci humanitních věd a vyhrožování „zrušením“ nebo zpoplatněním vysokoškolských oborů, které nekonvenují jejich vlastním ideologickým zájmům, dlouhodobě staví politický program. Obáváme se nejenom snah o odstranění těchto oborů, ale také o ovládnutí a následné rozložení univerzit zevnitř — například skrze samosprávné orgány, jako jsou akademické senáty — což by představovalo závažné ohrožení nezávislosti univerzit."
    en: "Humanities and social sciences are the foundation of a democratic and pluralistic society built on human rights and human dignity. It is no coincidence that authoritarian regimes throughout history have targeted them among their first victims. Representatives of the Motorists for Themselves party have long built their political programme on disparaging the humanities and threatening to ‚bolish” or introduce fees for university programmes that do not conform to their own ideological interests. We fear not only efforts to eliminate these programmes, but also attempts to seize and subsequently dismantle universities from within — for example through self-governing bodies such as academic senates — which would pose a serious threat to the independence of universities."

  # ⚠ HTML — keep <a href="...">…</a> links
  p5_html:
    cs: "Oceňujeme, že se vedení UK <a href=\"https://cuni.cz/UK-15771.html\">zastalo</a> studujících a svobody projevu v reakci na <a href=\"https://alipro.cz/otevreny-dopis-vedeni-univerzity-karlovy/\">otevřený dopis Aliance pro rodinu</a> , avšak je pro nás nepochopitelné, proč se obdobného zastání nedostává studujícím a vyučujícím zejména z Fakulty humanitních studií, čelícím stupňujícím se útokům. Znepokojuje nás také současné dění kolem předmětu Úvod do klimatické krize. I když podle dostupných informací došlo k jeho úpravě a disciplinárním postihům již před vystoupením ministra Macinky, celá situace a její mediální rámování poukazují na nebezpečí, kterým akademická obec čelí. Politické tlaky na ideologickou cenzuru vysokoškolského vzdělání nebo jeho zpoplatnění nabývají na síle a vnímáme je jako ohrožující pro demokratičnost akademie."
    en: "We appreciate that the leadership of Charles University <a href=\"https://cuni.cz/UK-15771.html\">stood up for</a> students and freedom of expression in response to the <a href=\"https://alipro.cz/otevreny-dopis-vedeni-univerzity-karlovy/\">open letter from the Alliance for Family</a>, however we cannot understand why similar support is not extended to students and teachers, especially at the Faculty of Humanities, who face escalating attacks. We are also troubled by the current developments surrounding the course Introduction to the Climate Crisis. Although, according to available information, changes and disciplinary measures were taken even before Minister Macinka’s intervention, the entire situation and its media framing highlight the dangers the academic community faces. Political pressure for ideological censorship of higher education, or the introduction of tuition fees, is intensifying, and we view it as a threat to the democratic character of academia."

  call_intro:
    cs: "Proto vyzýváme Univerzitu Karlovu, aby:"
    en: "We therefore call on Charles University to:"

  li1:
    cs: "neustupovala demagogickým, dehonestujícím a degradujícím narativům vládních a politických představitelů;"
    en: "not yield to the demagogic, demeaning, and degrading narratives of government and political representatives;"

  li2:
    cs: "se vymezila proti nenávisti, zastrašování a cenzuře, kterým její studentstvo a zaměstnanectvo v posledních týdnech čelí ze strany politických elit a některých médií;"
    en: "stand against the hatred, intimidation, and censorship that its students and staff have faced in recent weeks from political elites and certain media outlets;"

  li3:
    cs: "nadále bránila, kultivovala a udržovala hodnoty vysokoškolského vzdělávání, akademické svobody, jakož i demokratické a kritické diskuze."
    en: "continue to defend, cultivate, and uphold the values of higher education, academic freedom, and democratic and critical discourse."

  p6:
    cs: "Současné snahy o omezování akademických svobod vnímáme jako záminku pro postupnou destrukci demokratických institucí a rozklad právního státu. Se znepokojením sledujeme obdobné dění na poli kultury, ochrany životního prostředí, neziskového sektoru nebo veřejnoprávních médií. V této situaci je nutné držet při sobě a vytvářet sjednocenou protiváhu autoritářským tendencím."
    en: "We view the current efforts to restrict academic freedoms as a pretext for the gradual destruction of democratic institutions and the dismantling of the rule of law. We watch with concern similar developments in the fields of culture, environmental protection, the non-profit sector, and public media. In this situation, it is necessary to stand together and form a united counterweight to authoritarian tendencies."

  p7:
    cs: "S ohledem na aktuální tlak směřovaný převážně na Univerzitu Karlovu adresujeme tento dopis jejímu vedení. Možnost otevřeně debatovat, vyučovat a bádat bez ohledu na politické zájmy vládních stran se však týká nás všech, proto apelujeme i na další vysokoškolské, vzdělávací a kulturně-umělecké instituce, spojme se k obraně nezávislosti a svobody univerzit. Jsme s vámi, buďte s námi!"
    en: "Given the current pressure directed primarily at Charles University, we are addressing this letter to its leadership. However, the ability to openly debate, teach, and conduct research regardless of the political interests of governing parties concerns all of us — and so we also appeal to other higher education, educational, and cultural-artistic institutions: let us unite in defence of the independence and freedom of universities. We stand with you — stand with us!"

  signoff_1:
    cs: "S úctou,"
    en: "Respectfully,"

  signoff_2:
    cs: "studentstvo, pedagožstvo, akademické pracovnictvo a absolventstvo českých a slovenských univerzit."
    en: "students, teachers, academic staff, and graduates of Czech and Slovak universities."

  signoff_3:
    cs: "27. dubna 2026"
    en: "April 27, 2026"

  sig_link:
    cs: "Zobrazit seznam signatářů"
    en: "View the list of signatories"

  cta_title:
    cs: "Podpořte tento dopis svým podpisem"
    en: "Support this letter with your signature"

  cta_btn:
    cs: "Podepsat výzvu"
    en: "Sign the letter"


