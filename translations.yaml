  # ⚠ HTML — keep <strong> and <a href="...">
  li_tally_html:
    cs: "<strong>Tally.so</strong> – podpisový formulář provozuje společnost Tally.so (USA) jako zpracovatel dat (datový procesor dle čl. 28 GDPR). Tally.so může při vyplňování formuláře ukládat cookies a zpracovávat data na svých serverech mimo EU/EHP.\n              Předávání dat mimo EU/EHP se řídí standardními smluvními doložkami (SCC).\n              Více informací: <a href=\"https://tally.so/help/privacy-policy\" target=\"_blank\" rel=\"noopener\">Zásady ochrany soukromí Tally.so</a>."
    en: "<strong>Tally.so</strong> – the signing form is operated by Tally.so (USA) as a data processor (data processor under Art. 28 GDPR). Tally.so may store cookies when completing the form and process data on its servers outside the EU/EEA.\n              Data transfers outside the EU/EEA are governed by standard contractual clauses (SCCs).\n              More information: <a href=\"https://tally.so/help/privacy-policy\" target=\"_blank\" rel=\"noopener\">Tally.so Privacy Policy</a>."

  # ⚠ HTML — keep <strong> and <a href="...">
  li_google_html:
    cs: "<strong>Google LLC</strong> – web načítá písmo Inter ze serverů Google Fonts (fonts.googleapis.com). Při tomto načítání může být vaše IP adresa předána společnosti Google.\n              Více informací: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">Zásady ochrany soukromí Google</a>."
    en: "<strong>Google LLC</strong> – the website loads the Inter font from Google Fonts servers (fonts.googleapis.com). During this loading, your IP address may be shared with Google.\n              More information: <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener\">Google Privacy Policy</a>."

  # ⚠ HTML — keep <strong>
  li_github_html:
    cs: "<strong>GitHub, Inc.</strong> – web je hostován na platformě GitHub Pages. GitHub může zpracovávat základní technické údaje (IP adresa) v souladu s vlastními zásadami ochrany soukromí."
    en: "<strong>GitHub, Inc.</strong> – the website is hosted on the GitHub Pages platform. GitHub may process basic technical data (IP address) in accordance with its own privacy policy."

  h2_6:
    cs: "6. Vaše práva"
    en: "6. Your rights"

  p_rights:
    cs: "Jako subjekt údajů máte právo:"
    en: "As a data subject, you have the right:"

  # ⚠ HTML — keep <strong>
  li_access_html:
    cs: "<strong>na přístup</strong> ke svým osobním údajům (čl. 15 GDPR),"
    en: "<strong>of access</strong> to your personal data (Art. 15 GDPR),"

  li_rectification_html:
    cs: "<strong>na opravu</strong> nepřesných nebo neúplných údajů (čl. 16 GDPR),"
    en: "<strong>of rectification</strong> of inaccurate or incomplete data (Art. 16 GDPR),"

  li_erasure_html:
    cs: "<strong>na výmaz</strong> („právo být zapomenut“) (čl. 17 GDPR),"
    en: "<strong>of erasure</strong> (“right to be forgotten”) (Art. 17 GDPR),"

  li_restriction_html:
    cs: "<strong>na omezení zpracování</strong> (čl. 18 GDPR),"
    en: "<strong>of restriction of processing</strong> (Art. 18 GDPR),"

  li_portability_html:
    cs: "<strong>na přenositelnost údajů</strong> (čl. 20 GDPR),"
    en: "<strong>of data portability</strong> (Art. 20 GDPR),"

  li_objection_html:
    cs: "<strong>vznést námitku</strong> proti zpracování (čl. 21 GDPR),"
    en: "<strong>to object</strong> to processing (Art. 21 GDPR),"

  li_withdraw_html:
    cs: "<strong>odvolat souhlas</strong> kdykoli bez uvedení důvodu – odvolání souhlasu nemá vliv na zákonnost zpracování před jeho odvoláním."
    en: "<strong>to withdraw consent</strong> at any time without giving reasons – withdrawal of consent does not affect the lawfulness of processing carried out before the withdrawal."

  # ⚠ HTML — keep <a href="mailto:...">
  p_exercise_html:
    cs: "Svá práva uplatňujte e-mailem na adrese <a href=\"mailto:stojimesuniverzitami@gmail.com\">stojimesuniverzitami@gmail.com</a>. Na vaši žádost odpovíme bez zbytečného odkladu, nejpozději do 30 dnů."
    en: "You may exercise your rights by email at <a href=\"mailto:stojimesuniverzitami@gmail.com\">stojimesuniverzitami@gmail.com</a>. We will respond to your request without undue delay, within 30 days at the latest."

  # ⚠ HTML — keep <a href="...">
  p_supervisory_html:
    cs: "Máte rovněž právo podat stížnost u dozorového úřadu –\n            <a href=\"https://www.uoou.cz\" target=\"_blank\" rel=\"noopener\">Úřadu pro ochranu osobních údajů (ÚOOÚ)</a>."
    en: "You also have the right to lodge a complaint with the supervisory authority –\n            the <a href=\"https://www.uoou.cz\" target=\"_blank\" rel=\"noopener\">Office for Personal Data Protection (ÚOOÚ)</a>."

  h2_7:
    cs: "7. Zabezpečení"
    en: "7. Security"

  p_security:
    cs: "Přijímáme přiměřená technická a organizační opatření k ochraně vašich osobních údajů před neoprávněným přístupem, ztrátou nebo zneužitím. Komunikace se serverem je šifrována prostřednictvím protokolu HTTPS."
    en: "We take appropriate technical and organisational measures to protect your personal data against unauthorised access, loss, or misuse. Communication with the server is encrypted via the HTTPS protocol."

  h2_8:
    cs: "8. Změny těchto zásad"
    en: "8. Changes to this policy"

  # ⚠ HTML — keep <strong>
  p_changes_html:
    cs: "Tyto zásady mohou být příležitostně aktualizovány. Aktuální verze je vždy dostupná na této stránce. Datum poslední aktualizace: <strong>27. 04. 2026</strong>."
    en: "This policy may be updated occasionally. The current version is always available on this page. Date of last update: <strong>27 April 2026</strong>."
